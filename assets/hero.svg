<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="heroTitle heroDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="heroTitle">Taher Sohagpurwala — Full-Stack Product Engineer, AI/ML</title>
  <desc id="heroDesc">Boot card for Taher Sohagpurwala: full-stack product engineer and AI/ML builder in Mumbai. Ships 3D web experiences, AI-powered apps, big-data platforms and macOS utilities. Status: shipping.</desc>

  <style>
    /* ── palette (light default) ─────────────────────────────── */
    .bg      { fill:#ffffff; }
    .card    { fill:#ffffff; stroke:#d0d7de; stroke-width:1.5; }
    .grid-pt { fill:#1f2328; opacity:.07; }
    .t-primary { fill:#1f2328; }
    .t-muted   { fill:#59636e; }
    .t-faint   { fill:#818b98; }
    .accent  { fill:#cf222e; }
    .green   { fill:#1a7f37; }
    .divider { stroke:#d0d7de; stroke-width:1; }
    .track   { fill:#eaeef2; }
    .bar     { fill:#cf222e; }
    .led     { fill:#1a7f37; }
    .scan    { fill:#1f2328; opacity:0; }

    @media (prefers-color-scheme: dark) {
      .bg      { fill:#0d1117; }
      .card    { fill:#151b23; stroke:#30363d; stroke-width:1.5; }
      .grid-pt { fill:#e6edf3; opacity:.06; }
      .t-primary { fill:#e6edf3; }
      .t-muted   { fill:#9198a1; }
      .t-faint   { fill:#6e7681; }
      .accent  { fill:#ff7752; }
      .green   { fill:#3fb950; }
      .divider { stroke:#30363d; stroke-width:1; }
      .track   { fill:#21262d; }
      .bar     { fill:#ff7752; }
      .led     { fill:#3fb950; }
      .scan    { fill:#e6edf3; }
    }

    /* ── motion: play once on load, then settle ────────────── */
    .fade   { opacity:1; animation: rise .55s cubic-bezier(.2,.7,.3,1) backwards; }
    .bar-fill  { width:936px; animation: fillbar 1.3s cubic-bezier(.3,.6,.2,1) 1.2s backwards; }
    .accentbar { width:150px;  animation: growbar .6s cubic-bezier(.2,.7,.3,1) 1.0s backwards; }
    .led       { opacity:1;   animation: lightup .45s ease-out backwards; }
    .led-ring  { opacity:0;   animation: ringpulse 1.1s ease-out forwards; }
    .scanline  { opacity:0;   animation: scanmove 1.4s cubic-bezier(.4,.1,.3,1) .25s forwards; }

    @keyframes rise    { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fillbar { from { width:0; } to { width:936px; } }
    @keyframes growbar { from { width:0; } to { width:150px; } }
    @keyframes lightup { from { opacity:.12; } to { opacity:1; } }
    @keyframes ringpulse { 0% { opacity:.55; } 100% { opacity:0; } }
    @keyframes scanmove { 0% { opacity:.14; transform:translateX(0); } 96% { opacity:.14; transform:translateX(990px); } 100% { opacity:0; transform:translateX(990px); } }

    @media (prefers-reduced-motion: reduce) {
      .fade, .bar-fill, .accentbar, .led, .scanline { animation: none; }
      .led-ring { opacity: 0; }
    }
  </style>

  <!-- backdrop + card -->
  <rect class="bg" x="0" y="0" width="1040" height="420" rx="0"/>
  <rect class="card" x="8" y="8" width="1024" height="404" rx="14"/>

  <!-- faint engineering dot-grid -->
  <g class="grid">
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle class="grid-pt" cx="1.2" cy="1.2" r="1.2"/>
    </pattern>
    <rect x="10" y="10" width="1020" height="400" rx="13" fill="url(#dots)"/>
  </g>

  <!-- one-time scan line -->
  <rect class="scanline" x="16" y="10" width="3" height="400" rx="1.5"/>

  <!-- ══ terminal column ══════════════════════════════════ -->
  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="16.5">
    <text class="fade" style="animation-delay:.10s" x="52" y="78" font-weight="600">$ taher --init</text>
    <text class="fade t-muted" style="animation-delay:.35s" x="52" y="106">&#9656; identity........... <tspan class="t-primary" font-weight="600">loaded</tspan></text>
    <text class="fade t-muted" style="animation-delay:.55s" x="52" y="134">&#9656; systems............ <tspan class="t-primary" font-weight="600">7 live</tspan> &#183; <tspan class="t-primary" font-weight="600">20+ shipped</tspan></text>
    <text class="fade t-muted" style="animation-delay:.75s" x="52" y="162">&#9656; domains............ 3d-web &#183; ai &#183; big-data &#183; macos</text>
    <text class="fade t-muted" style="animation-delay:.95s" x="52" y="190">&#9656; status............. <tspan class="green" font-weight="700">SHIPPING</tspan></text>

    <line class="divider fade" style="animation-delay:1.05s" x1="52" y1="212" x2="420" y2="212" stroke-dasharray="4 5"/>

    <text class="fade" style="animation-delay:1.20s" x="52" y="248" font-weight="600">$ uptime</text>
    <text class="fade t-muted" style="animation-delay:1.35s" x="52" y="276">&#9656; building........... FORGE &#183; Playable Portfolio</text>
    <text class="fade t-muted" style="animation-delay:1.50s" x="52" y="304">&#9656; location........... Mumbai, IN</text>
  </g>

  <!-- ══ identity lockup ═══════════════════════════════════ -->
  <text class="fade t-faint" style="animation-delay:.50s" x="490" y="104" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5">// FULL-STACK PRODUCT ENGINEER &#8212; AI/ML</text>

  <text class="fade t-primary" style="animation-delay:.70s" x="487" y="168" font-size="58" font-weight="800" letter-spacing="1">TAHER</text>
  <text class="fade t-primary" style="animation-delay:.85s" x="487" y="230" font-size="58" font-weight="800" letter-spacing="1">SOHAGPURWALA</text>

  <rect class="accentbar accent" x="490" y="248" width="150" height="6" rx="3"/>

  <text class="fade t-muted" style="animation-delay:1.15s" x="490" y="284" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="14.5">complete products — deployed, tested, used in real life.</text>

  <!-- domain status LEDs -->
  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="12.5" font-weight="600">
    <circle class="led-ring" style="animation-delay:1.30s" cx="498" cy="336" r="9" fill="none" stroke="#3fb950" stroke-width="2"/>
    <circle class="led" style="animation-delay:1.30s" cx="498" cy="336" r="4"/>
    <text class="fade t-muted" style="animation-delay:1.30s" x="512" y="341">3D &#183; WEBGPU</text>

    <circle class="led-ring" style="animation-delay:1.45s" cx="634" cy="336" r="9" fill="none" stroke="#3fb950" stroke-width="2"/>
    <circle class="led" style="animation-delay:1.45s" cx="634" cy="336" r="4"/>
    <text class="fade t-muted" style="animation-delay:1.45s" x="648" y="341">AI PRODUCTS</text>

    <circle class="led-ring" style="animation-delay:1.60s" cx="776" cy="336" r="9" fill="none" stroke="#3fb950" stroke-width="2"/>
    <circle class="led" style="animation-delay:1.60s" cx="776" cy="336" r="4"/>
    <text class="fade t-muted" style="animation-delay:1.60s" x="790" y="341">BIG DATA</text>

    <circle class="led-ring" style="animation-delay:1.75s" cx="878" cy="336" r="9" fill="none" stroke="#3fb950" stroke-width="2"/>
    <circle class="led" style="animation-delay:1.75s" cx="878" cy="336" r="4"/>
    <text class="fade t-muted" style="animation-delay:1.75s" x="892" y="341">MACOS</text>
  </g>

  <!-- ══ boot progress ═════════════════════════════════════ -->
  <rect class="track fade" style="animation-delay:1.10s" x="52" y="368" width="936" height="4" rx="2"/>
  <rect class="bar-fill bar" x="52" y="368" width="936" height="4" rx="2"/>
  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="11.5" font-weight="600">
    <text class="fade t-faint" style="animation-delay:1.90s" x="52" y="394">TAHER53-S / PROFILE &#183; BOOT v2</text>
    <text class="fade green" style="animation-delay:2.05s" x="988" y="394" text-anchor="end">ALL SYSTEMS SHIPPING &#9679;</text>
  </g>
</svg>
