<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="560" viewBox="0 0 1520 560" role="img" aria-labelledby="heroTitle heroDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="heroTitle">Taher Sohagpurwala — Full-Stack Product Engineer · AI/ML</title>
  <desc id="heroDesc">Boot card for Taher Sohagpurwala, a full-stack product engineer and AI/ML builder in Mumbai. 6 live deployments, 20+ systems shipped. Status: all systems shipping. Domains: 3D/WebGPU, AI products, big data, macOS.</desc>

  <style>
    /* ── palette (light default, dark via scheme) ─────────────── */
    .bg        { fill:#ffffff; }
    .t-primary { fill:#1f2328; }
    .t-muted   { fill:#59636e; }
    .t-faint   { fill:#6e7a87; }
    .green     { fill:#1a7f37; }
    .accent    { fill:#cf222e; }
    .track     { fill:#e9edf1; }

    @media (prefers-color-scheme: dark) {
      .bg        { fill:#0d1117; }
      .t-primary { fill:#e6edf3; }
      .t-muted   { fill:#9198a1; }
      .t-faint   { fill:#768390; }
      .green     { fill:#3fb950; }
      .accent    { fill:#ff7752; }
      .track     { fill:#21262d; }
    }

    /* ── motion: reveal once, then settle. Base state = final state,
          so every element is visible when animations are disabled. ── */
    .fade   { opacity:1; animation: rise .6s cubic-bezier(.2,.7,.3,1) backwards; }
    .name   { opacity:1; animation: rise .8s cubic-bezier(.16,.8,.3,1) .65s backwards; }
    .accentbar { width:150px;  animation: growbar .55s cubic-bezier(.2,.7,.3,1) 1.35s backwards; }
    .bootbar   { width:1328px; animation: fillbar 1.1s cubic-bezier(.3,.5,.2,1) 2.5s backwards; }
    .led       { opacity:1; animation: lightup .45s ease-out backwards; }

    @keyframes rise    { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    @keyframes growbar { from { width:0; } to { width:150px; } }
    @keyframes fillbar { from { width:0; } to { width:1328px; } }
    @keyframes lightup { from { opacity:.12; } to { opacity:1; } }

    @media (prefers-reduced-motion: reduce) {
      .fade, .name, .accentbar, .bootbar, .led { animation: none; }
    }
  </style>

  <rect class="bg" width="1520" height="560"/>

  <!-- ══ zone A · boot whisper ═══════════════════════════════ -->
  <text class="fade" style="animation-delay:.05s" x="96" y="84" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="13.5"><tspan class="t-primary" font-weight="600">$ taher --init</tspan><tspan class="t-faint"> — 6 live · 20+ shipped · Mumbai, IN</tspan></text>
  <text class="fade green" style="animation-delay:.45s" x="1424" y="84" text-anchor="end" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2">&#9679; ONLINE</text>

  <!-- ══ zone B · identity ═══════════════════════════════════ -->
  <text class="name t-primary" x="760" y="272" text-anchor="middle" font-size="84" font-weight="800" letter-spacing="2">TAHER SOHAGPURWALA</text>

  <text class="fade t-muted" style="animation-delay:1.05s" x="760" y="338" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="19" font-weight="500" letter-spacing="6">FULL-STACK PRODUCT ENGINEER &#183; AI/ML</text>

  <rect class="accentbar accent" x="685" y="368" width="150" height="5" rx="2.5"/>

  <text class="fade green" style="animation-delay:1.65s" x="760" y="420" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="3">&#9679; ALL SYSTEMS SHIPPING</text>

  <!-- ══ zone C · supporting detail ═══════════════════════════ -->
  <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="13.5" font-weight="600" letter-spacing="1">
    <circle class="led green" style="animation-delay:1.95s" cx="466" cy="463" r="4.5"/>
    <text class="fade t-faint" style="animation-delay:1.95s" x="486" y="468">3D &#183; WEBGPU</text>

    <circle class="led green" style="animation-delay:2.10s" cx="640" cy="463" r="4.5"/>
    <text class="fade t-faint" style="animation-delay:2.10s" x="660" y="468">AI PRODUCTS</text>

    <circle class="led green" style="animation-delay:2.25s" cx="814" cy="463" r="4.5"/>
    <text class="fade t-faint" style="animation-delay:2.25s" x="834" y="468">BIG DATA</text>

    <circle class="led green" style="animation-delay:2.40s" cx="962" cy="463" r="4.5"/>
    <text class="fade t-faint" style="animation-delay:2.40s" x="982" y="468">MACOS &#183; SWIFT</text>
  </g>

  <!-- ══ boot end · hairline fills once, then still ═══════════ -->
  <rect class="track fade" style="animation-delay:2.40s" x="96" y="534" width="1328" height="2.5" rx="1.25"/>
  <rect class="bootbar accent" x="96" y="534" width="1328" height="2.5" rx="1.25"/>
</svg>
